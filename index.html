<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Tiếng Anh Đại Mỗ 7 GK1</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Carlito:ital,wght@0,400;0,700;1,400;1,700&display=swap">
<style>
/* Bố cục: phiếu bài tập kiểu giấy thi, một cột. Thanh cố định trên cùng có tên học sinh, tiến độ và các ô chuyển phần. */
:root{
  --bg:#f2f4f9; --surface:#ffffff; --surface-2:#e9edf6; --ink:#14203a; --ink-2:#4a5774; --line:#d3dae9;
  --accent:#1f4fd8; --accent-ink:#ffffff; --accent-soft:#e3eafc;
  --ok:#0f7a45; --ok-soft:#ddf2e6; --bad:#bf242c; --bad-soft:#fbe2e3; --warn:#9a5700; --warn-soft:#fff0d3;
  --note:#fff3c2; --note-line:#2f55d4;
  --font:Calibri,Carlito,"Segoe UI","Helvetica Neue",Arial,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e1420; --surface:#172034; --surface-2:#1f2a44; --ink:#e8edf9; --ink-2:#a8b4cf; --line:#2d3b5c;
    --accent:#8aa9ff; --accent-ink:#0b1630; --accent-soft:#1f2e5a;
    --ok:#63d69c; --ok-soft:#133526; --bad:#ff949a; --bad-soft:#3e1b20; --warn:#f2b862; --warn-soft:#3a2b10;
    --note:#3b3617; --note-line:#8aa9ff;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1420; --surface:#172034; --surface-2:#1f2a44; --ink:#e8edf9; --ink-2:#a8b4cf; --line:#2d3b5c;
  --accent:#8aa9ff; --accent-ink:#0b1630; --accent-soft:#1f2e5a;
  --ok:#63d69c; --ok-soft:#133526; --bad:#ff949a; --bad-soft:#3e1b20; --warn:#f2b862; --warn-soft:#3a2b10;
  --note:#3b3617; --note-line:#8aa9ff;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:13pt;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
body.in-work::before{background:var(--surface)}
button,input{font:inherit;color:inherit}
h1,h2,h3,p{margin:0}
[hidden]{display:none!important}
.wrap{max-width:56em;margin-inline:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* Màn hình nhập tên */
.start{padding-block:2em 3em}
.start .wrap{max-width:42em}
.brand{display:flex;align-items:center;gap:.8em;margin-bottom:1.6em}
.brand img{width:3.4em;height:3.4em;border-radius:8px;display:block}
.eyebrow{font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
.start h1{font-size:2.4em;line-height:1.1;margin:.15em 0 .5em;text-wrap:balance}
.lead-p{color:var(--ink-2);max-width:38em}
.paper{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:1.2em 1.3em;margin-top:1.4em}
.name-row{display:flex;flex-wrap:wrap;align-items:baseline;gap:.3em .7em}
.name-row label{font-weight:700}
.name-row input{flex:1 1 14em;min-width:0;border:0;border-bottom:2px dotted var(--ink-2);background:transparent;padding:.3em .2em;border-radius:0}
.name-row input:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.err{color:var(--bad);font-weight:700;margin-top:.5em}
.paper .btn{margin-top:1em}
.how{margin:1.3em 0 0;padding-left:1.2em;display:grid;gap:.3em;color:var(--ink-2)}

/* Nút */
.btn{font-weight:700;padding:.5em 1.1em;border-radius:8px;border:1.5px solid var(--accent);cursor:pointer;min-height:44px;background:transparent;color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn:focus-visible,.chip:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn:disabled{opacity:.55;cursor:default}

/* Thanh cố định */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.bar-top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:.2em 1em;padding-top:.5em}
.who{min-width:0;display:flex;align-items:baseline;gap:.5em}
.who .k{color:var(--ink-2)}
.who b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prog{display:flex;align-items:center;gap:.6em;font-variant-numeric:tabular-nums}
.prog-track{width:7em;height:.55em;border-radius:99px;background:var(--surface-2);overflow:hidden}
.prog-fill{height:100%;width:0;background:var(--accent)}
.score-top{font-weight:700;color:var(--accent)}
.chips{display:flex;gap:.4em;overflow-x:auto;padding:.4em 0 .6em;scrollbar-width:thin}
.chip{flex:0 0 auto;display:flex;flex-direction:column;align-items:flex-start;padding:.1em .7em;border:1.5px solid var(--line);border-radius:8px;background:var(--surface);cursor:pointer;line-height:1.3}
.chip .c-no{font-weight:700}
.chip .c-st{color:var(--ink-2);font-variant-numeric:tabular-nums}
.chip.done.good{border-color:var(--ok);background:var(--ok-soft)}
.chip.done.mid{border-color:var(--warn);background:var(--warn-soft)}
.chip.done.low{border-color:var(--bad);background:var(--bad-soft)}
.chip.done .c-st{color:var(--ink);font-weight:700}

/* Nội dung phiếu */
main{padding-block:1.2em 3em}
.title-block{margin-bottom:.4em}
.title-block .eyebrow{display:block}
.title-block h1{font-size:1.9em;line-height:1.15}
.part{font-size:1.2em;margin:1.8em 0 .2em;letter-spacing:.02em;text-wrap:balance}
.sec{background:var(--surface);border:1px solid var(--line);border-radius:12px;margin-block:.9em 1.4em;overflow:clip;scroll-margin-top:calc(var(--hdr,130px) + 10px)}
.sec-h{padding:.8em 1em;background:var(--surface-2);border-bottom:1px solid var(--line);display:grid;gap:.2em}
.sec-no{font-weight:700;color:var(--accent)}
.instr{font-weight:700;font-style:italic}
.sec-b{padding:.2em 1em .6em}
.sec-b>:first-child{border-top:0}
.sub{font-size:1em;font-style:italic;margin:.9em 0 .3em;color:var(--ink-2)}
.box{border:1.5px solid var(--ink);border-radius:4px;padding:.7em .9em;margin-block:.6em;background:var(--surface)}
.box p+p{margin-top:.3em}
.box .bt{font-weight:700}
.passage{margin-block:.7em;max-width:44em}
.passage p+p{margin-top:.6em}
.shared{margin-block:.6em;display:grid;gap:.25em}
.shared b,.sent b{margin-right:.4em}
.blank{display:inline-block;min-width:4.2em;border-bottom:1.5px solid var(--ink);vertical-align:baseline;margin-inline:.1em}
.q{padding:.8em 1em;margin-inline:-1em;border-top:1px solid var(--line);scroll-margin-top:calc(var(--hdr,130px) + 14px)}
.q.row{display:grid;grid-template-columns:2.3em 1fr;gap:.2em .3em;align-items:baseline}
.qn{font-weight:700}
.qline{display:block}
.stem .q-line,.qx{margin-top:.3em}
.qx{max-width:44em}
.qx p+p{margin-top:.4em}
.sent{margin-top:.25em}
.notice{margin-block:.5em;background:var(--note);border:2px solid var(--note-line);border-radius:4px;padding:.6em .9em;max-width:34em}
.sign{display:block;max-width:100%;width:13em;height:auto;margin-block:.5em;border-radius:6px;background:#fff;border:1px solid var(--line)}
.opts{display:grid;gap:.45em;margin-top:.4em}
.opts.c4{grid-template-columns:repeat(auto-fit,minmax(8.5em,1fr))}
.opts.c2{grid-template-columns:repeat(auto-fit,minmax(15em,1fr))}
.opts.c1{grid-template-columns:minmax(0,1fr)}
.opts.cc{grid-template-columns:repeat(4,minmax(0,5.5em));}
.opt{position:relative;display:flex;gap:.55em;align-items:baseline;padding:.35em .65em;border:1.5px solid var(--line);border-radius:8px;background:var(--surface);cursor:pointer;min-height:2.3em;min-width:0}
.opt input{position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0;cursor:pointer}
.opt .ltr{font-weight:700;color:var(--accent);min-width:1.1em}
.opt .ot{min-width:0;overflow-wrap:anywhere}
.opt:focus-within{outline:2px solid var(--accent);outline-offset:2px}
.opt.is-picked{border-color:var(--accent);background:var(--accent-soft)}
.checked .opt{cursor:default}
.checked .opt input{cursor:default}
.checked .opt:not(.is-picked){opacity:.6}
.opt.is-right{border-color:var(--ok);background:var(--ok-soft)}
.opt.is-wrong{border-color:var(--bad);background:var(--bad-soft)}
.ans-row{display:flex;flex-wrap:wrap;align-items:baseline;gap:.4em .6em;margin-top:.45em}
.ans-row .lead{font-weight:700}
.txt{flex:1 1 16em;min-width:0;padding:.4em .65em;border:1.5px solid var(--line);border-radius:8px;background:var(--surface)}
.txt:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.is-right .txt{border-color:var(--ok);background:var(--ok-soft)}
.is-wrong .txt{border-color:var(--bad);background:var(--bad-soft)}
.tag{margin-top:.5em;font-weight:700;display:flex;align-items:center;gap:.4em}
.tag svg{flex:none}
.q.is-right{background:var(--ok-soft)}
.q.is-right .opt:not(.is-right){background:var(--surface)}
.q.is-right .tag{color:var(--ok)}
.q.is-wrong{background:var(--bad-soft)}
.q.is-wrong .tag{color:var(--bad)}
.sec-f{padding:.8em 1em 1em;border-top:1px solid var(--line)}
.sec-act{display:flex;flex-wrap:wrap;align-items:center;gap:.4em .9em}
.hint{color:var(--ink-2)}
.hint.warn{color:var(--warn);font-weight:700}
.sec-res{padding:.6em .9em;border-radius:8px;border:1.5px solid var(--line)}
.sec-res.is-good{background:var(--ok-soft);border-color:var(--ok)}
.sec-res.is-mid{background:var(--warn-soft);border-color:var(--warn)}
.sec-res.is-low{background:var(--bad-soft);border-color:var(--bad)}
.sec-res p+p{margin-top:.2em}

/* Nộp bài */
.finish{background:var(--surface);border:1.5px solid var(--ink);border-radius:12px;padding:1.1em 1.3em;margin-block:1.6em}
.finish h2{font-size:1.4em;margin-bottom:.2em}
.finish .btn{margin-top:.8em}
.result{background:var(--surface);border:1.5px solid var(--ink);border-radius:12px;padding:1.2em 1.3em;margin-block:1.4em;scroll-margin-top:calc(var(--hdr,130px) + 10px)}
.result h2{font-size:1.5em;text-wrap:balance}
.score{display:flex;flex-wrap:wrap;align-items:baseline;gap:.1em 1em;margin-block:.6em .8em}
.score-n{font-size:4em;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.score-d{font-size:1.5em;font-weight:700;color:var(--ink-2)}
.score-c{color:var(--ink-2)}
.tbl-wrap{overflow-x:auto;margin-block:.5em 1.2em}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:.35em .7em .35em 0;border-bottom:1px solid var(--line);white-space:nowrap}
th{color:var(--ink-2)}
.mini{display:inline-block;width:6em;height:.5em;border-radius:99px;background:var(--surface-2);vertical-align:middle;overflow:hidden}
.mini i{display:block;height:100%;background:var(--accent)}
.result h3{font-size:1.2em;margin-block:1em .3em}
.rvg{font-weight:700;margin-top:1.1em;padding-bottom:.2em;border-bottom:2px solid var(--ink)}
.rv{border:1px solid var(--line);border-radius:10px;padding:.8em 1em;margin-block:.7em;background:var(--surface)}
.rv-h{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:.3em .8em}
.rv-h b{color:var(--bad)}
.rv .go{min-height:36px;padding:.15em .8em}
.rv-ctx{margin-top:.4em;color:var(--ink-2)}
.rv-stem{margin-top:.4em}
.rv .notice{margin-block:.4em}
.rv-opts{display:grid;gap:.3em;margin-top:.5em}
.rv-o{display:flex;flex-wrap:wrap;align-items:baseline;gap:.1em .6em;padding:.3em .6em;border-radius:6px;border:1.5px solid transparent}
.rv-o .ltr{font-weight:700;color:var(--accent);min-width:1.1em}
.rv-o .ot{flex:1 1 12em;min-width:0}
.rv-o .rv-m{font-weight:700}
.rv-o.is-key{background:var(--ok-soft);border-color:var(--ok)}
.rv-o.is-key .rv-m{color:var(--ok)}
.rv-o.is-pick-wrong{background:var(--bad-soft);border-color:var(--bad)}
.rv-o.is-pick-wrong .rv-m{color:var(--bad)}
.rv-line{margin-top:.4em}
.rv-k{font-weight:700;margin-right:.5em}
.rv-w{color:var(--bad);font-weight:700}
.rv-r{color:var(--ok);font-weight:700}
.rv-note{margin-top:.4em;color:var(--bad);font-weight:700}
.res-act{display:flex;flex-wrap:wrap;gap:.6em;margin-top:1.2em}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
@media (max-width:520px){
  .prog-track{width:4.5em}
  .score-n{font-size:3.2em}
}
</style>

<section id="start" class="start">
  <div class="wrap">
    <div class="brand">
      <img id="logo" alt="Logo trung tâm STEN" width="120" height="120">
      <span class="eyebrow">Đại Mỗ 7 GK1 | 2026</span>
    </div>
    <h1>Môn Tiếng Anh</h1>
    <p class="lead-p" id="start-info"></p>
    <form class="paper" id="start-form" novalidate>
      <div class="name-row">
        <label for="name">Họ và tên:</label>
        <input id="name" type="text" autocomplete="name" maxlength="60" placeholder="Nhập họ và tên của em">
      </div>
      <p class="err" id="name-err" hidden></p>
      <button type="submit" class="btn primary">Bắt đầu làm bài</button>
      <ul class="how">
        <li>Chọn đủ đáp án của một phần, kết quả đúng hay sai của phần đó hiện ngay.</li>
        <li>Nộp bài để xem điểm trên thang 10 và xem lại các câu đã làm sai.</li>
      </ul>
    </form>
  </div>
</section>

<div id="work" hidden>
  <header class="bar" id="bar">
    <div class="wrap">
      <div class="bar-top">
        <div class="who"><span class="k">Học sinh:</span><b id="who"></b></div>
        <div class="prog"><span>Đã làm <b id="prog-n">0</b></span><span class="prog-track"><span class="prog-fill" id="prog-fill"></span></span><span class="score-top" id="score-top" hidden></span></div>
      </div>
      <nav class="chips" id="chips" aria-label="Các phần của bài"></nav>
    </div>
  </header>
  <main>
    <div class="wrap">
      <div class="title-block">
        <span class="eyebrow">Đại Mỗ 7 GK1 | 2026</span>
        <h1>MÔN TIẾNG ANH</h1>
      </div>
      <div id="sheet"></div>
      <section class="finish" id="finish">
        <h2>Nộp bài</h2>
        <p id="finish-info"></p>
        <button type="button" class="btn primary" id="submit">Nộp bài và xem điểm</button>
        <p class="hint" id="submit-note" hidden></p>
      </section>
      <section class="result" id="result" hidden aria-live="polite"></section>
    </div>
  </main>
</div>

/* ===== TIỆN ÍCH ===== */
function $(s,r){return (r||document).querySelector(s);}
function $$(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s));}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c];});}
function blanks(h){return String(h).replace(/_{3,}/g,"<span class=\"blank\"></span>");}
function num(n){return n.toLocaleString("vi-VN",{maximumFractionDigits:2});}
function plain(h){return String(h).replace(/<[^>]+>/g,"");}
var ICON_OK="<svg viewBox=\"0 0 20 20\" width=\"1.1em\" height=\"1.1em\" aria-hidden=\"true\"><path d=\"M4 10.5l4 4 8-9\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></svg>";
var ICON_NO="<svg viewBox=\"0 0 20 20\" width=\"1.1em\" height=\"1.1em\" aria-hidden=\"true\"><path d=\"M5 5l10 10M15 5L5 15\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\"/></svg>";
function smooth(){return (window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches)?"auto":"smooth";}
function goTo(el,block){if(el&&el.scrollIntoView){el.scrollIntoView({behavior:smooth(),block:block||"start"});}}

/* ===== CHỈ MỤC CÂU HỎI ===== */
var QS=[],QMAP={},SMAP={};
SECTIONS.forEach(function(sec){
  var sub="";sec.qs=[];SMAP[sec.id]=sec;
  sec.nodes.forEach(function(n){
    if(n.t==="sub"){sub=n.text;}
    if(n.t==="q"){
      n.sec=sec;n.sub=sub;n.id=sec.id+"-"+(sec.qs.length+1);
      var lab=n.label.replace(/[.:]$/,"");
      n.ref=lab+" ("+sec.name+")";
      n.short=lab;
      sec.qs.push(n);QS.push(n);QMAP[n.id]=n;
    }
  });
  sec.auto=sec.qs.every(function(q){return q.kind==="mc";});
});
var TOTAL=QS.length;

/* ===== TRẠNG THÁI ===== */
var KEY="dm7-gk1-state";
var S={name:"",answers:{},checked:{},submitted:false};
var pendingSubmit=false;
function save(){try{sessionStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
function load(){try{var v=JSON.parse(sessionStorage.getItem(KEY)||"null");if(v&&typeof v.name==="string"&&v.name){S={name:v.name,answers:v.answers||{},checked:v.checked||{},submitted:!!v.submitted};}}catch(e){}}
function has(q){var v=S.answers[q.id];return v!==undefined&&String(v).trim()!=="";}

/* ===== CHẤM ===== */
function norm(s){
  return String(s).toLowerCase().replace(/[’‘`]/g,"'").replace(/won't/g,"will not").replace(/can't/g,"cannot").replace(/n't\b/g," not")
    .replace(/-/g," ").replace(/[^a-z0-9' ]/g," ").replace(/\s+/g," ").trim();
}
function cands(q){
  var base=q.accept||[q.key],out=[];
  base.forEach(function(a){out.push(a);if(q.lead){out.push(q.lead.replace(/[…]+/g,"").trim()+" "+a);}});
  return out;
}
function isRight(q){
  var v=S.answers[q.id];
  if(v===undefined||String(v).trim()==="")return false;
  if(q.kind==="mc")return q.ans.indexOf(v)>=0;
  var n=norm(v);
  return cands(q).some(function(c){return norm(c)===n;});
}
function secRight(sec){return sec.qs.filter(isRight).length;}
function keyShow(q){
  if(q.kind==="mc")return q.ans.join(" hoặc ");
  return (q.lead?q.lead.replace(/[…]+/g,"").trim()+" ":"")+q.key;
}

/* ===== VẼ GIAO DIỆN ===== */
function optsHTML(q){
  var maxLen=Math.max.apply(null,q.opts.map(function(o){return plain(o).length;}));
  var cols=q.compact?"cc":(maxLen<=14?"c4":(maxLen<=36?"c2":"c1"));
  return "<div class=\"opts "+cols+"\" role=\"radiogroup\" aria-label=\"Chọn đáp án "+esc(q.short)+"\">"+q.opts.map(function(o,i){
    var L="ABCD".charAt(i);
    return "<label class=\"opt\" data-v=\""+L+"\"><input type=\"radio\" name=\"r-"+q.id+"\" value=\""+L+"\"><span class=\"ltr\">"+L+"</span>"+(q.compact?"":"<span class=\"ot\">"+blanks(o)+"</span>")+"</label>";
  }).join("")+"</div>";
}
function textHTML(q){
  var inp="<input type=\"text\" class=\"txt\" id=\"in-"+q.id+"\" data-q=\""+q.id+"\" autocomplete=\"off\" autocapitalize=\"off\" spellcheck=\"false\" aria-label=\"Câu trả lời "+esc(q.short)+"\" placeholder=\""+(q.lead?"Viết phần còn lại của câu":"Viết câu hoàn chỉnh")+"\">";
  return "<div class=\"ans-row\">"+(q.lead?"<span class=\"lead\">→ "+esc(q.lead)+"</span>":"")+inp+"</div>";
}
function qHTML(q){
  var label="<b class=\"qn\">"+q.label+"</b>";
  var row=/^\d+\.$/.test(q.label)&&!q.stem&&!q.img&&!q.notice&&!q.extra&&q.kind==="mc";
  var tag="<div class=\"tag\" hidden></div>";
  if(row){
    return "<div class=\"q row\" id=\"q-"+q.id+"\" data-q=\""+q.id+"\">"+label+"<div class=\"qb\">"+optsHTML(q)+tag+"</div></div>";
  }
  var h="<div class=\"q\" id=\"q-"+q.id+"\" data-q=\""+q.id+"\"><div class=\"qb\"><div class=\"qline\">"+label+(q.stem?" <span class=\"stem\">"+blanks(q.stem)+"</span>":"")+"</div>";
  if(q.extra)h+="<div class=\"qx\">"+blanks(q.extra)+"</div>";
  if(q.notice)h+="<div class=\"notice\">"+q.notice+"</div>";
  if(q.img)h+="<img class=\"sign\" src=\""+IMG[q.img]+"\" alt=\""+esc(ALT[q.img])+"\">";
  h+=(q.kind==="text"?textHTML(q):optsHTML(q))+tag+"</div></div>";
  return h;
}
function nodeHTML(n){
  if(n.t==="sub")return "<h3 class=\"sub\">"+n.text+"</h3>";
  if(n.t==="box")return "<div class=\"box\">"+blanks(n.html)+"</div>";
  if(n.t==="passage")return "<div class=\"passage\">"+blanks(n.html)+"</div>";
  if(n.t==="list")return "<div class=\"shared\">"+n.html+"</div>";
  return qHTML(n);
}
function secHTML(sec){
  var hintTxt=sec.auto?"Kết quả hiện ngay khi em chọn đủ đáp án của phần này.":"Điền đủ các câu rồi bấm để xem kết quả của phần này.";
  return (sec.part?"<h2 class=\"part\">"+sec.part+"</h2>":"")+
  "<section class=\"sec\" id=\"sec-"+sec.id+"\" data-sec=\""+sec.id+"\">"+
    "<header class=\"sec-h\"><span class=\"sec-no\">"+(sec.title||sec.name)+"</span><p class=\"instr\">"+sec.instr+"</p></header>"+
    "<div class=\"sec-b\">"+sec.nodes.map(nodeHTML).join("")+"</div>"+
    "<footer class=\"sec-f\"><div class=\"sec-act\"><button type=\"button\" class=\"btn"+(sec.auto?"":" primary")+"\" data-check=\""+sec.id+"\">Chấm phần này</button><span class=\"hint\" data-hint=\""+sec.id+"\">"+hintTxt+"</span></div>"+
    "<div class=\"sec-res\" data-res=\""+sec.id+"\" hidden></div></footer>"+
  "</section>";
}
function hint(sec,text,warn){
  var h=$("[data-hint=\""+sec.id+"\"]");if(!h)return;
  h.textContent=text||(sec.auto?"Kết quả hiện ngay khi em chọn đủ đáp án của phần này.":"Điền đủ các câu rồi bấm để xem kết quả của phần này.");
  h.className="hint"+(warn?" warn":"");
}

/* ===== CHẤM TỪNG PHẦN ===== */
function applyCheck(sec){
  var el=$("#sec-"+sec.id);el.classList.add("checked");
  var right=0,wrong=[];
  sec.qs.forEach(function(q){
    var ok=isRight(q),qe=$("#q-"+q.id),blank=!has(q);
    qe.classList.add(ok?"is-right":"is-wrong");
    var tag=$(".tag",qe);tag.hidden=false;
    tag.innerHTML=(ok?ICON_OK+"<span>Đúng</span>":ICON_NO+"<span>"+(blank?"Chưa làm, tính là sai":"Sai")+"</span>");
    $$("input",qe).forEach(function(i){if(i.type==="radio"){i.disabled=true;}else{i.readOnly=true;}});
    if(q.kind==="mc"){
      var v=S.answers[q.id],lab=v?$(".opt[data-v=\""+v+"\"]",qe):null;
      if(lab){lab.classList.add("is-picked",ok?"is-right":"is-wrong");}
    }
    if(ok){right++;}else{wrong.push(q);}
  });
  var p=right/sec.qs.length,cls=wrong.length===0?"is-good":(p>=0.5?"is-mid":"is-low");
  var res=$("[data-res=\""+sec.id+"\"]",el);res.hidden=false;res.className="sec-res "+cls;
  res.innerHTML="<p><b>Kết quả phần "+sec.name+": đúng "+right+"/"+sec.qs.length+" câu.</b></p>"+
    (wrong.length?"<p>Câu sai hoặc chưa làm: "+wrong.map(function(q){return esc(q.short);}).join(", ")+". Đáp án đúng sẽ hiện ở phần xem lại sau khi nộp bài.</p>":"<p>Em làm đúng tất cả các câu của phần này.</p>");
  $(".sec-act",el).hidden=true;
}
function checkSection(sec){
  if(S.checked[sec.id])return;
  S.checked[sec.id]=true;applyCheck(sec);refresh();save();
}
function onAnswered(sec){
  sec.pending=false;hint(sec);
  pendingSubmit=false;resetSubmitUI();
  if(sec.auto&&sec.qs.every(has)){checkSection(sec);return;}
  refresh();save();
}

/* ===== TIẾN ĐỘ VÀ Ô CHUYỂN PHẦN ===== */
function totalScore(){var r=QS.filter(isRight).length;return Math.round(r/TOTAL*10*100)/100;}
function refresh(){
  var answered=QS.filter(has).length;
  $("#prog-n").textContent=answered+"/"+TOTAL;
  $("#prog-fill").style.width=(answered/TOTAL*100)+"%";
  SECTIONS.forEach(function(sec){
    var chip=$("#chip-"+sec.id),st=$("#cs-"+sec.id);
    if(S.checked[sec.id]){
      var r=secRight(sec),p=r/sec.qs.length;
      st.textContent="Đúng "+r+"/"+sec.qs.length;
      chip.className="chip done "+(p>=0.8?"good":(p>=0.5?"mid":"low"));
    }else{
      st.textContent=sec.qs.filter(has).length+"/"+sec.qs.length;
      chip.className="chip";
    }
  });
  var sc=$("#score-top");
  if(S.submitted){sc.hidden=false;sc.textContent="Điểm "+num(totalScore())+"/10";}else{sc.hidden=true;}
}
function buildChips(){
  $("#chips").innerHTML=SECTIONS.map(function(sec){
    return "<button type=\"button\" class=\"chip\" id=\"chip-"+sec.id+"\" data-go=\""+sec.id+"\" aria-label=\"Đến phần "+sec.name+"\"><span class=\"c-no\">"+sec.name+"</span><span class=\"c-st\" id=\"cs-"+sec.id+"\"></span></button>";
  }).join("");
}
function setHdr(){
  var b=$("#bar");if(b){document.documentElement.style.setProperty("--hdr",b.offsetHeight+"px");}
}

/* ===== KẾT QUẢ CUỐI BÀI VÀ XEM LẠI ===== */
function reviewItem(q){
  var v=S.answers[q.id],h="<article class=\"rv\" data-rq=\""+q.id+"\"><div class=\"rv-h\"><b>"+esc(q.ref)+"</b><button type=\"button\" class=\"btn go\" data-goq=\""+q.id+"\">Xem trong bài</button></div>";
  if(!q.stem&&q.sec.ctx)h+="<p class=\"rv-ctx\">"+q.sec.ctx+"</p>";
  if(q.stem)h+="<p class=\"rv-stem\">"+blanks(q.stem)+"</p>";
  if(q.extra)h+="<div class=\"qx\">"+blanks(q.extra)+"</div>";
  if(q.notice)h+="<div class=\"notice\">"+q.notice+"</div>";
  if(q.img)h+="<img class=\"sign\" src=\""+IMG[q.img]+"\" alt=\""+esc(ALT[q.img])+"\">";
  if(q.kind==="mc"){
    h+="<div class=\"rv-opts\">"+q.opts.map(function(o,i){
      var L="ABCD".charAt(i),isKey=q.ans.indexOf(L)>=0,isPick=v===L;
      var cls=isKey?" is-key":(isPick?" is-pick-wrong":"");
      return "<div class=\"rv-o"+cls+"\"><span class=\"ltr\">"+L+"</span><span class=\"ot\">"+blanks(o)+"</span>"+(isKey?"<span class=\"rv-m\">Đáp án đúng</span>":(isPick?"<span class=\"rv-m\">Em đã chọn</span>":""))+"</div>";
    }).join("")+"</div>";
    if(!v)h+="<p class=\"rv-note\">Em chưa chọn đáp án cho câu này.</p>";
  }else{
    h+="<p class=\"rv-line\"><span class=\"rv-k\">Em viết:</span><span class=\"rv-w\">"+(v&&String(v).trim()?esc(v):"(để trống)")+"</span></p>"+
       "<p class=\"rv-line\"><span class=\"rv-k\">Đáp án:</span><span class=\"rv-r\">"+esc(keyShow(q))+"</span></p>";
  }
  return h+"</article>";
}
function showResult(){
  var rows=SECTIONS.map(function(sec){return {sec:sec,right:secRight(sec),n:sec.qs.length};});
  var right=rows.reduce(function(a,r){return a+r.right;},0);
  var score=totalScore();
  var groups=SECTIONS.map(function(sec){return {sec:sec,wrong:sec.qs.filter(function(q){return !isRight(q);})};}).filter(function(g){return g.wrong.length;});
  var wrongN=TOTAL-right;
  var h="<h2>Kết quả của "+esc(S.name)+"</h2>"+
    "<div class=\"score\"><span class=\"score-n\">"+num(score)+"</span><span class=\"score-d\">/ 10</span><span class=\"score-c\">Đúng "+right+" trên "+TOTAL+" câu</span></div>"+
    "<div class=\"tbl-wrap\"><table><thead><tr><th>Phần</th><th>Đúng</th><th>Tổng</th><th>Tỉ lệ</th></tr></thead><tbody>"+
    rows.map(function(r){var p=Math.round(r.right/r.n*100);return "<tr><td>"+r.sec.name+"</td><td>"+r.right+"</td><td>"+r.n+"</td><td><span class=\"mini\"><i style=\"width:"+p+"%\"></i></span> "+p+"%</td></tr>";}).join("")+
    "</tbody></table></div>";
  if(wrongN===0){
    h+="<h3>Xem lại</h3><p>Em đã làm đúng cả "+TOTAL+" câu, không có câu nào cần xem lại.</p>";
  }else{
    h+="<h3>Xem lại "+wrongN+" câu làm sai hoặc chưa làm</h3><p class=\"score-c\">Mỗi câu hiện đáp án đúng và lựa chọn của em. Bấm \"Xem trong bài\" để đọc lại đề.</p>";
    groups.forEach(function(g){
      h+="<div class=\"rvg\">"+g.sec.name+": "+g.wrong.length+" câu cần xem lại</div>"+g.wrong.map(reviewItem).join("");
    });
  }
  h+="<div class=\"res-act\"><button type=\"button\" class=\"btn primary\" id=\"redo\">Làm lại bài</button><button type=\"button\" class=\"btn\" id=\"other\">Học sinh khác</button></div>";
  var box=$("#result");box.innerHTML=h;box.hidden=false;
  var sb=$("#submit");sb.disabled=true;sb.textContent="Đã nộp bài";
  refresh();
}
function resetSubmitUI(){
  var n=$("#submit-note");n.hidden=true;n.textContent="";
  var sb=$("#submit");if(!S.submitted){sb.textContent="Nộp bài và xem điểm";}
}

/* ===== DỰNG TRANG TỪ TRẠNG THÁI ===== */
function build(){
  document.body.classList.add("in-work");
  $("#start").hidden=true;$("#work").hidden=false;
  $("#who").textContent=S.name;
  $("#finish-info").textContent="Kiểm tra lại các phần trước khi nộp. Điểm tính trên "+TOTAL+" câu, quy về thang điểm 10.";
  buildChips();
  $("#sheet").innerHTML=SECTIONS.map(secHTML).join("");
  SECTIONS.forEach(function(sec){sec.pending=false;});
  QS.forEach(function(q){
    var v=S.answers[q.id];if(v===undefined)return;
    var qe=$("#q-"+q.id);
    if(q.kind==="mc"){
      var inp=$("input[value=\""+v+"\"]",qe);
      if(inp){inp.checked=true;inp.closest(".opt").classList.add("is-picked");}
    }else{$("input.txt",qe).value=v;}
  });
  SECTIONS.forEach(function(sec){if(S.checked[sec.id]){applyCheck(sec);}});
  var sb=$("#submit");sb.disabled=false;sb.textContent="Nộp bài và xem điểm";
  $("#result").hidden=true;$("#submit-note").hidden=true;
  pendingSubmit=false;
  refresh();
  if(S.submitted){showResult();}
  setHdr();
}

/* ===== SỰ KIỆN ===== */
$("#logo").src=IMG.logo;
$("#start-info").textContent="Bài gồm "+SECTIONS.length+" phần nhỏ với "+TOTAL+" câu trắc nghiệm: Phonetics, Vocabulary and Grammar và Reading.";

$("#start-form").addEventListener("submit",function(e){
  e.preventDefault();
  var v=$("#name").value.replace(/\s+/g," ").trim(),err=$("#name-err");
  if(v.length<2){err.hidden=false;err.textContent="Em hãy nhập họ và tên (ít nhất 2 ký tự) trước khi làm bài.";$("#name").focus();return;}
  err.hidden=true;
  S={name:v.slice(0,60),answers:{},checked:{},submitted:false};
  save();build();window.scrollTo(0,0);
});

$("#sheet").addEventListener("change",function(e){
  var t=e.target;if(!t||t.type!=="radio")return;
  var q=QMAP[t.closest(".q").dataset.q];
  if(!q||S.checked[q.sec.id]||S.submitted)return;
  S.answers[q.id]=t.value;
  $$(".opt",t.closest(".q")).forEach(function(o){o.classList.toggle("is-picked",o.getAttribute("data-v")===t.value);});
  onAnswered(q.sec);
});
$("#sheet").addEventListener("input",function(e){
  var t=e.target;if(!t||!t.classList||!t.classList.contains("txt"))return;
  var q=QMAP[t.dataset.q];
  if(!q||S.checked[q.sec.id]||S.submitted)return;
  S.answers[q.id]=t.value;
  onAnswered(q.sec);
});
$("#sheet").addEventListener("click",function(e){
  var b=e.target.closest("[data-check]");if(!b)return;
  var sec=SMAP[b.getAttribute("data-check")];
  if(S.checked[sec.id]||S.submitted)return;
  var un=sec.qs.filter(function(q){return !has(q);}).length;
  if(un>0&&!sec.pending){sec.pending=true;hint(sec,"Còn "+un+" câu chưa làm. Bấm lần nữa để chấm, câu bỏ trống tính là sai.",true);return;}
  checkSection(sec);
});
$("#chips").addEventListener("click",function(e){
  var b=e.target.closest("[data-go]");if(!b)return;
  goTo($("#sec-"+b.getAttribute("data-go")));
});
$("#submit").addEventListener("click",function(){
  if(S.submitted)return;
  var un=QS.filter(function(q){return !has(q);}).length;
  if(un>0&&!pendingSubmit){
    pendingSubmit=true;
    var n=$("#submit-note");n.hidden=false;n.className="hint warn";
    n.textContent="Còn "+un+" câu chưa làm. Bấm \"Nộp bài\" lần nữa để nộp, các câu bỏ trống tính là sai.";
    $("#submit").textContent="Nộp bài, bỏ qua câu chưa làm";
    return;
  }
  SECTIONS.forEach(function(sec){if(!S.checked[sec.id]){S.checked[sec.id]=true;applyCheck(sec);}});
  S.submitted=true;save();showResult();
  goTo($("#result"));
});
$("#result").addEventListener("click",function(e){
  var g=e.target.closest("[data-goq]");
  if(g){goTo($("#q-"+g.getAttribute("data-goq")),"center");return;}
  if(e.target.id==="redo"){
    S.answers={};S.checked={};S.submitted=false;save();build();window.scrollTo(0,0);return;
  }
  if(e.target.id==="other"){
    try{sessionStorage.removeItem(KEY);}catch(x){}
    S={name:"",answers:{},checked:{},submitted:false};
    document.body.classList.remove("in-work");
    $("#work").hidden=true;$("#start").hidden=false;$("#name").value="";
    window.scrollTo(0,0);$("#name").focus();
  }
});
if(window.ResizeObserver){new ResizeObserver(setHdr).observe($("#bar"));}
window.addEventListener("resize",setHdr);

load();
if(S.name){build();}
})();
</script>

</body></html>
